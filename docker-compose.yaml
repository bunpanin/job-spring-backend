services:
  jobspring-db:
    image: postgres:16
    container_name: jobspring-db
    environment:
      POSTGRES_DB: jobspring
      POSTGRES_USER: jobspring
      POSTGRES_PASSWORD: jobspring123
    ports:
      - "5432:5432"
    volumes:
      - jobspring_data:/var/lib/postgresql/data
    networks:
      - job-spring-net

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    ports:
      - "5433:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - job-spring-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: jobspring-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - job-spring-net

volumes:
  jobspring_data:
  keycloak_data:

networks:
  job-spring-net:
    driver: bridge