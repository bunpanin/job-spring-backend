services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-cont
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: job_spring_db
      POSTGRES_USER: jobspring
      POSTGRES_PASSWORD: jobspring@123
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    ports:
      - "9090:8080"
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  keycloak_pg_data:
